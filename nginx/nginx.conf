worker_processes 1;
pid /Users/soumen.dass2024nst.rishihood.edu.in/Desktop/cn-project/nginx/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    resolver 10.7.3.54 valid=30s;
    access_log /Users/soumen.dass2024nst.rishihood.edu.in/Desktop/cn-project/nginx/logs/access.log;
    error_log  /Users/soumen.dass2024nst.rishihood.edu.in/Desktop/cn-project/nginx/logs/error.log;

    upstream backend_pool {
        server 10.7.26.82:5001 max_fails=2 fail_timeout=10s;
        server 10.7.24.85:5002 max_fails=2 fail_timeout=10s;
    }

    server {
        listen       80;
        server_name  app.team1.test api.team1.test edge.team1.test standby.team1.test;
        return 301   https://$host$request_uri;
    }

    server {
        listen       443 ssl;
        http2        on;
        server_name  app.team1.test api.team1.test edge.team1.test standby.team1.test;

        ssl_certificate     /Users/soumen.dass2024nst.rishihood.edu.in/Desktop/cn-project/nginx/ssl/server.crt;
        ssl_certificate_key /Users/soumen.dass2024nst.rishihood.edu.in/Desktop/cn-project/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header X-Edge-Node "primary-m2" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location / {
            proxy_pass         http://backend_pool;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 3s;
            proxy_read_timeout    15s;
        }

        location /nginx-health {
            default_type application/json;
            return 200 '{"status":"ok","edge":"primary-m2","domain":"team1.test"}';
        }
    }
}
