# CN Project — Nginx Reverse Proxy with TLS
# Machine: M2 (Prakhar) — 10.7.28.103
# DNS Server: M1 (Shreshtha) — 10.7.8.86

events {
    worker_connections 1024;
}

http {
    # Use the custom DNS server for upstream resolution
    resolver 10.7.8.86:1053 valid=30s;

    # Logging
    access_log /opt/homebrew/var/log/nginx/cn_access.log;
    error_log  /opt/homebrew/var/log/nginx/cn_error.log;

    # Upstream pool — both backends for load balancing
    upstream backend_pool {
        server 10.7.28.103:5001;   # Backend A (M2 - Prakhar)
        server 10.7.6.34:5002;     # Backend B (M3 - Soumen)
    }

    # ─── Redirect HTTP → HTTPS ───
    server {
        listen       80;
        server_name  prakhar.cnproject.local backenda.cnproject.local m2.cnproject.local;
        return 301   https://$host$request_uri;
    }

    # ─── HTTPS Server ───
    server {
        listen       443 ssl;
        server_name  prakhar.cnproject.local backenda.cnproject.local m2.cnproject.local;

        # TLS Certificates
        ssl_certificate     /Users/prakharsrivastava/Desktop/Cn_backend/nginx/ssl/server.crt;
        ssl_certificate_key /Users/prakharsrivastava/Desktop/Cn_backend/nginx/ssl/server.key;

        # TLS Settings
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Content-Type-Options    nosniff;
        add_header X-Frame-Options           DENY;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ─── Proxy to Backend Pool ───
        location / {
            proxy_pass         http://backend_pool;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Failover: skip to next server on error
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # Health check endpoint
        location /nginx-health {
            return 200 '{"status":"ok","server":"nginx-m2"}';
            add_header Content-Type application/json;
        }
    }
}
